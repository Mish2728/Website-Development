<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My SuperHero</title>
    <style>
        *{
            background-color: rgb(250, 215, 231);
            color: rgb(65, 2, 124);
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        .name{
            font-weight:bold;
font-size:60px;
text-shadow: 3px 3px rgb(215, 101, 244);
        }
        .tagline{
            font-style: italic;
            color: blueviolet;
            text-transform: capitalize;
        }
        .label{
            text-transform: uppercase;
            text-decoration: underline;
            color: rgb(62, 24, 122);
        }
        .powers{
            text-decoration-line:underline;
            text-decoration-style: dashed ;
            text-decoration-color: rgb(81, 1, 156);
            color: rgb(245, 8, 8);
        }
        .weakness{
            text-decoration: line-through;
            color: rgb(252, 8, 118);
        }
        .badge{
            transform: rotate(15deg);
        }
    </style>
</head>
<body>
<h1 class="title">MY SUPERHERO</h1>
<h2 class="name">Ankit Khosla</h2>
<h3 class="tagline">The most powerful hero you can ever see
</h3>
<h2 class="label">Super Powers</h2>
<p class="powers">Drives car faster than needed</p>
<p class="powers">Can help me like a maths tutor and help me</p>
<h2 class="label">weakness</h2>
<p class="weakness">Cannot hit me even a single time(yay!)</p>
<p class="weakness">Cannot force me (or will get scolded by dadi)</p>
<p class="badge">No.1 superhero</p>
</body>
</html>
