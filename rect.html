<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectangle</title>
    <style>
        .rect{
            border: 1px solid black;
            height: 200px;
            width: 250px;
            margin: auto;

        }
         .buttons{
            padding: 10px;
            width: 200px;
            margin: auto;
            text-align: center;
        } 
    </style>
</head>
<body>
  <h2>Make Changes to the Rectangle</h2>
  <div class="rect"></div> 
  <div class="buttons">
<button onclick="makeacircle()">MAKE A CIRCLE</button>
<button onclick="hiderect()">HIDE</button>
<button onclick="showrect()">SHOW</button>
  </div>
  <script>
let div=document.querySelector(".rect");
function makeacircle(){
    div.style.borderRadius="50%";
}
    function hiderect() {
        div.style.display = "none";
    }
    function showrect() {
            div.style.display = "block";            
        }
        div.onmouseenter= function (){
            div.style.background="pink";
        }
         div.onmouseleave = function () {
                div.style.background = "transparent";
            }   
  </script> 
</body>
</html>
