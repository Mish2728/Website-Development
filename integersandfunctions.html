<body>
    <h2>Welcome to the world of JAVASCRIPT</h2>
    <script>
        function sum() {
            let x, y, z;
            x = 7;
            y = 8;
            z = x + y;
            return z;
        }
        let answer = sum()
        console.log("The sum of two numbers is " + answer)
    function product() {
        let x, y, z;
        x = 2;
        y = 4;
        z = x * y;
        return z;
    }
    let answer = product()
    console.log("The sum of two numbers is " * answer)
    function difference() {
            let x, y, z;
            x = 12;
            y = 8;
            z = x - y;
            return z;
        }
        let answer = sum()
        console.log("The sum of two numbers is " - answer)
        function quotient() {
                let x, y, z;
                x = 7;
                y = 8;
                z = x + y;
                return z;
            }
            let answer = quotient()
            console.log("The sum of two numbers is " / answer)
    </script>
